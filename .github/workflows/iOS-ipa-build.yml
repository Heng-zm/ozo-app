name: iOS-ipa-build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag (optional, e.g. v1.1.0)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/iOS-ipa-build.yml'
    tags: [ 'v*' ]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-ios:
    name: 🎉 iOS Release Build (.ipa)
    runs-on: macos-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 📦 Install pub dependencies
        run: flutter pub get

      - name: 🔧 Generate Xcode config (config-only)
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: 🦕 CocoaPods Setup
        run: |
          if [ -f "ios/Podfile" ]; then
            echo "📦 Podfile found. Running pod install..."
            cd ios
            pod install --repo-update || pod install
            cd ..
          else
            echo "ℹ️ No Podfile present; skipping CocoaPods install."
          fi

      - name: 🔐 Setup Apple Signing Certificate (Optional)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ozo_temp_keychain_pwd' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/
          echo "✅ Apple Developer Signing Certificate configured."

      - name: 🔓 Patch Xcode signing (for unsigned sideload build)
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g'                               "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g'                 "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;//g'                           "$PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g'   "$PBX"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g'     "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = [^;]*;/ "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          sed -i '' '/CODE_SIGNING_ALLOWED/d'                                      "$PBX"

          {
            echo ""
            echo "// Unsigned sideload overrides"
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGNING_IDENTITY="
            echo "DEVELOPMENT_TEAM="
            echo "PROVISIONING_PROFILE_SPECIFIER="
          } >> ios/Flutter/Generated.xcconfig

          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            [ -f "$f" ] && {
              echo "CODE_SIGNING_ALLOWED=NO"  >> "$f"
              echo "CODE_SIGNING_REQUIRED=NO" >> "$f"
              echo "CODE_SIGNING_IDENTITY="      >> "$f"
            }
          done

          echo "✅ Sideload signing bypass patches applied."

      - name: 🏗️ Build iOS Application
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Building signed iOS archive via Flutter..."
            flutter build ipa --release \
              --build-number=${{ github.run_number }} \
              --build-name=1.1.${{ github.run_number }}
          else
            echo "Building unsigned iOS app..."
            flutter build ios --release --no-codesign \
              --build-number=${{ github.run_number }} \
              --build-name=1.1.${{ github.run_number }}
          fi

      - name: 📦 Package .ipa for Sideloading / Distribution
        run: |
          VERSION="1.1.${{ github.run_number }}"

          if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "Found Flutter-exported IPA..."
            cp build/ios/ipa/*.ipa ozo-app-ios.ipa
          else
            echo "Packaging Runner.app into standard Payload directory..."
            APP_PATH=$(find build -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)

            if [ -z "$APP_PATH" ]; then
              echo "❌ Runner.app not found. Searching build directory:"
              find build -name "*.app" -type d || true
              exit 1
            fi

            echo "✅ Located: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/Runner.app
            zip -qr -9 ozo-app-ios.ipa Payload
            rm -rf Payload
          fi

          cp ozo-app-ios.ipa "OZO-v${VERSION}.ipa"
          shasum -a 256 ozo-app-ios.ipa > ozo-app-ios.ipa.sha256
          shasum -a 256 "OZO-v${VERSION}.ipa" > "OZO-v${VERSION}.ipa.sha256"

          echo "=== Built IPA Package Details ==="
          ls -lh ozo-app-ios.ipa "OZO-v${VERSION}.ipa"
          cat ozo-app-ios.ipa.sha256

      - name: 📤 Upload IPA to Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ozo-app-ios-ipa
          path: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
            OZO-v*.ipa
            OZO-v*.ipa.sha256
          retention-days: 30

      # ---------------------------------------------------------------
      # OTA: Generate manifest.plist + install page hosted on gh-pages
      # iOS Safari reads itms-services://?action=download-manifest&url=
      # and triggers a native install prompt — no PC required.
      # ---------------------------------------------------------------
      - name: 🌐 Generate OTA manifest + install page
        run: |
          REPO="${{ github.repository }}"
          RUN="${{ github.run_number }}"
          VERSION="1.1.${RUN}"
          OWNER="${{ github.repository_owner }}"
          REPO_NAME="${{ github.event.repository.name }}"

          # The IPA will be uploaded as a release asset — build its direct URL
          IPA_URL="https://github.com/${REPO}/releases/download/v${VERSION}/OZO-v${VERSION}.ipa"

          # GitHub Pages URL for this repo
          PAGES_URL="https://${OWNER}.github.io/${REPO_NAME}"
          MANIFEST_URL="${PAGES_URL}/manifest.plist"

          mkdir -p ota

          # manifest.plist — iOS reads this to know what to install
          cat > ota/manifest.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>items</key>
            <array>
              <dict>
                <key>assets</key>
                <array>
                  <dict>
                    <key>kind</key>       <string>software-package</string>
                    <key>url</key>        <string>${IPA_URL}</string>
                  </dict>
                </array>
                <key>metadata</key>
                <dict>
                  <key>bundle-identifier</key> <string>com.antigravity.lan.lanTelegram</string>
                  <key>bundle-version</key>     <string>${VERSION}</string>
                  <key>kind</key>               <string>software</string>
                  <key>title</key>              <string>OZO Messenger</string>
                </dict>
              </dict>
            </array>
          </dict>
          </plist>
          PLIST

          # index.html — tap the button on iPhone Safari to install
          cat > ota/index.html << HTML
          <!DOCTYPE html>
          <html lang="en">
          <head>
            <meta charset="UTF-8"/>
            <meta name="viewport" content="width=device-width, initial-scale=1"/>
            <title>OZO Messenger — Install</title>
            <style>
              body{font-family:-apple-system,sans-serif;background:#0d1117;color:#fff;
                   display:flex;flex-direction:column;align-items:center;
                   justify-content:center;min-height:100vh;margin:0;padding:24px;box-sizing:border-box;}
              h1{font-size:1.8rem;margin-bottom:4px;font-weight:700;}
              p{color:#8b949e;margin-bottom:32px;font-size:.95rem;}
              a.btn{display:inline-block;background:#238636;color:#fff;
                    padding:16px 40px;border-radius:14px;font-size:1.1rem;
                    font-weight:600;text-decoration:none;letter-spacing:.3px;
                    box-shadow:0 4px 14px rgba(35,134,54,0.4);}
              .note{margin-top:24px;color:#8b949e;font-size:.8rem;text-align:center;line-height:1.5;}
            </style>
          </head>
          <body>
            <h1>⚡ OZO Messenger</h1>
            <p>v${VERSION} · P2P Encrypted Messenger & High-Speed LAN Transfer</p>
            <a class="btn"
               href="itms-services://?action=download-manifest&url=${MANIFEST_URL}">
              ⬇️ Install on iPhone
            </a>
            <p class="note">
              Open this page in <strong>Safari</strong> on your iPhone.<br/>
              Chrome and Firefox cannot trigger OTA installs.<br/><br/>
              ⚠️ Device must be registered in Apple Developer portal<br/>
              or use AltStore / Sideloadly / TrollStore for truly unsigned install.
            </p>
          </body>
          </html>
          HTML

          echo "✅ OTA files generated."
          echo "MANIFEST_URL=${MANIFEST_URL}" >> $GITHUB_ENV
          echo "PAGES_URL=${PAGES_URL}" >> $GITHUB_ENV

      - name: 🚀 Publish to GitHub Releases
        if: (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch') && !cancelled()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ (github.event.inputs != null && github.event.inputs.release_tag != '') && github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.1.{0}', github.run_number)) }}
          name: ${{ (github.event.inputs != null && github.event.inputs.release_tag != '') && github.event.inputs.release_tag || format('OZO Messenger v1.1.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
            OZO-v*.ipa
            OZO-v*.ipa.sha256
          body: |
            ## ⚡ OZO Messenger — v1.1.${{ github.run_number }}

            | Field | Value |
            |---|---|
            | Platform | iOS (.ipa) |
            | Bundle ID | com.antigravity.lan.lanTelegram |
            | Build Run | ${{ github.run_number }} |

            ### 📲 Install Methods
            1. **Sideload (No Jailbreak Needed)**:
               - Install using [AltStore](https://altstore.io), [Sideloadly](https://sideloadly.io), [TrollStore](https://trollstore.app), [Scarlet](https://usescarlet.com), or [LiveContainer](https://github.com/khanhduytran0/LiveContainer).
            2. **Direct Safari Install (if Pages enabled)**:
               - Open: ${{ env.PAGES_URL }} on iPhone Safari.

      # Deploy the OTA page to GitHub Pages (continue-on-error ensures job succeeds even if Pages is disabled)
      - name: 📤 Deploy OTA page to GitHub Pages
        if: !cancelled()
        continue-on-error: true
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./ota
          force_orphan: true