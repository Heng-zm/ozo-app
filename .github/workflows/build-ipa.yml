name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag (optional, e.g. v1.0.0)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ipa.yml'
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate Xcode config (config-only)
        run: |
          flutter build ios --release --config-only --no-codesign \
            --build-number=${{ github.run_number }} \
            --build-name=1.1.${{ github.run_number }}

      - name: Configure CocoaPods
        run: |
          if [ -f "ios/Podfile" ]; then
            echo "📦 Podfile found. Running pod install..."
            cd ios
            pod install --repo-update || pod install
            cd ..
          else
            echo "ℹ️ No Podfile present; skipping CocoaPods install."
          fi

      - name: Setup Apple Signing Certificate (Optional)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ozo_temp_keychain_pwd' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: 🔓 Patch Xcode signing (for unsigned sideload build)
        if: env.APPLE_CERTIFICATE_BASE64 == ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          PBX="ios/Runner.xcodeproj/project.pbxproj"

          sed -i '' 's/DEVELOPMENT_TEAM = [^;]*;//g'                               "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE_SPECIFIER = [^;]*;//g'                 "$PBX"
          sed -i '' 's/PROVISIONING_PROFILE = [^;]*;//g'                           "$PBX"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g'   "$PBX"
          sed -i '' 's/CODE_SIGNING_REQUIRED = YES;/CODE_SIGNING_REQUIRED = NO;/g' "$PBX"
          sed -i '' 's/CODE_SIGN_IDENTITY = [^;]*;/CODE_SIGN_IDENTITY = "";/g'     "$PBX"
          sed -i '' 's/"CODE_SIGN_IDENTITY\[sdk=iphoneos\*\]" = [^;]*;/ "CODE_SIGN_IDENTITY[sdk=iphoneos*]" = "";/g' "$PBX"
          sed -i '' '/CODE_SIGNING_ALLOWED/d'                                      "$PBX"

          {
            echo ""
            echo "// Unsigned sideload overrides"
            echo "CODE_SIGNING_ALLOWED=NO"
            echo "CODE_SIGNING_REQUIRED=NO"
            echo "CODE_SIGN_IDENTITY="
            echo "DEVELOPMENT_TEAM="
            echo "PROVISIONING_PROFILE_SPECIFIER="
          } >> ios/Flutter/Generated.xcconfig

          for f in ios/Flutter/Release.xcconfig ios/Flutter/Debug.xcconfig; do
            [ -f "$f" ] && {
              echo "CODE_SIGNING_ALLOWED=NO"  >> "$f"
              echo "CODE_SIGNING_REQUIRED=NO" >> "$f"
              echo "CODE_SIGN_IDENTITY="      >> "$f"
            }
          done

          echo "✅ Sideload signing bypass patches applied."

      - name: Build iOS Application
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Building signed iOS archive via Flutter..."
            flutter build ipa --release \
              --build-number=${{ github.run_number }} \
              --build-name=1.1.${{ github.run_number }}
          else
            echo "Building unsigned iOS app..."
            flutter build ios --release --no-codesign \
              --build-number=${{ github.run_number }} \
              --build-name=1.1.${{ github.run_number }}
          fi

      - name: Package .ipa File
        run: |
          VERSION="1.1.${{ github.run_number }}"

          if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "Using Flutter-exported IPA..."
            cp build/ios/ipa/*.ipa ozo-app-ios.ipa
          else
            echo "Packaging Runner.app into standard Payload directory..."
            APP_PATH=$(find build -name "Runner.app" -type d | grep -E "Release-iphoneos|iphoneos" | head -n 1)

            if [ -z "$APP_PATH" ]; then
              echo "❌ Runner.app not found. Searching build directory:"
              find build -name "*.app" -type d || true
              exit 1
            fi

            echo "✅ Located: $APP_PATH"
            mkdir -p Payload
            cp -R "$APP_PATH" Payload/Runner.app
            zip -qr -9 ozo-app-ios.ipa Payload
            rm -rf Payload
          fi

          cp ozo-app-ios.ipa "OZO-v${VERSION}.ipa"
          shasum -a 256 ozo-app-ios.ipa > ozo-app-ios.ipa.sha256
          shasum -a 256 "OZO-v${VERSION}.ipa" > "OZO-v${VERSION}.ipa.sha256"

          echo "=== Built IPA Info ==="
          ls -lh ozo-app-ios.ipa "OZO-v${VERSION}.ipa"
          cat ozo-app-ios.ipa.sha256

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ozo-app-ios-ipa
          path: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
            OZO-v*.ipa
            OZO-v*.ipa.sha256
          retention-days: 30

      - name: Publish to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event.inputs != null && github.event.inputs.release_tag != '') || github.event_name == 'workflow_dispatch') && !cancelled()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ (github.event.inputs != null && github.event.inputs.release_tag != '') && github.event.inputs.release_tag || (startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.1.{0}', github.run_number)) }}
          name: ${{ (github.event.inputs != null && github.event.inputs.release_tag != '') && github.event.inputs.release_tag || format('OZO Messenger v1.1.{0}', github.run_number) }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
            OZO-v*.ipa
            OZO-v*.ipa.sha256
