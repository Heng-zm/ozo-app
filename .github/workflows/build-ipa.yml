name: Build iOS IPA

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'GitHub Release Tag (optional, e.g. v1.0.0)'
        required: false
        default: ''
  push:
    branches: [ main, master ]
    paths:
      - 'ios/**'
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/build-ipa.yml'
    tags: [ 'v*' ]

permissions:
  contents: write

jobs:
  build-ipa:
    name: Build iOS (.ipa)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure CocoaPods
        run: |
          cd ios
          pod install || true
          cd ..

      - name: Setup Apple Signing Certificate (Optional)
        if: env.APPLE_CERTIFICATE_BASE64 != ''
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISIONING_PROFILE_BASE64: ${{ secrets.APPLE_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD || 'ozo_temp_keychain_pwd' }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

          CERT_PATH=$RUNNER_TEMP/build_cert.p12
          echo -n "$APPLE_CERTIFICATE_BASE64" | base64 --decode -o $CERT_PATH
          security import $CERT_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
          security list-keychain -d user -s $KEYCHAIN_PATH

          PROFILE_PATH=$RUNNER_TEMP/profile.mobileprovision
          echo -n "$APPLE_PROVISIONING_PROFILE_BASE64" | base64 --decode -o $PROFILE_PATH
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $PROFILE_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build iOS Application
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "Building signed iOS archive..."
            flutter build ipa --release
          else
            echo "Building unsigned iOS binary..."
            flutter build ios --release --no-codesign
          fi

      - name: Package .ipa File
        run: |
          if ls build/ios/ipa/*.ipa 1> /dev/null 2>&1; then
            echo "Using Flutter-exported IPA..."
            cp build/ios/ipa/*.ipa ozo-app-ios.ipa
          else
            echo "Packaging Payload directory into standard .ipa bundle..."
            mkdir -p Payload
            if [ -d "build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app" ]; then
              cp -R build/ios/archive/Runner.xcarchive/Products/Applications/Runner.app Payload/
            elif [ -d "build/ios/iphoneos/Runner.app" ]; then
              cp -R build/ios/iphoneos/Runner.app Payload/
            fi
            zip -qr ozo-app-ios.ipa Payload
            rm -rf Payload
          fi

          shasum -a 256 ozo-app-ios.ipa > ozo-app-ios.ipa.sha256
          echo "=== Built IPA Info ==="
          ls -lh ozo-app-ios.ipa
          cat ozo-app-ios.ipa.sha256

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ozo-app-ios-ipa
          path: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
          retention-days: 30

      - name: Publish to GitHub Release
        if: (startsWith(github.ref, 'refs/tags/v') || (github.event.inputs != null && github.event.inputs.release_tag != '')) && !cancelled()
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ (github.event.inputs != null && github.event.inputs.release_tag != '') && github.event.inputs.release_tag || github.ref_name }}
          files: |
            ozo-app-ios.ipa
            ozo-app-ios.ipa.sha256
